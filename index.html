<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <div class="container">

        <div>
            <svg width="200" height="200">
                <rect class="shape square" x="10" y="50" width="100" height="100" />
            </svg>
        </div>

        <div>
            <svg width="200" height="200">
                <rect class="shape rectangle" x="10" y="50" width="150" height="100" />
            </svg>
        </div>

        <div>
            <svg width="200" height="200">
                <circle class="shape circle" cx="100" cy="100" r="50" />
            </svg>
        </div>

        <div>
            <svg width="200" height="200">
                <defs>
                    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#87CEFA" />
                        <stop offset="100%" stop-color="#FFD700" />
                    </linearGradient>
                </defs>
                <ellipse class="shape ellipse" cx="100" cy="100" rx="90" ry="50" />
            </svg>
        </div>

    </div>

</html>
